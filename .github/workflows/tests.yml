name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  c-core-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd csrc && make test

  go-claim-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # crypto/mldsa (FIPS 204) is a Go 1.27 package.
          go-version: '1.27'
      - run: go test -count=1 ./...
      - name: Adversary harness
        run: go run ./attacks

  independent-checkers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/gen_vectors.py && python3 tools/linspread_check.py
      - name: Regenerated paper numbers
        run: make numbers
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/check_site_core.js
