name: build-paper

# Compiles paper/main.tex with tectonic and commits the rendered PDF back
# to main. Runs on every push that touches the source or this workflow, and
# can also be triggered manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - 'paper/main.tex'
      - '.github/workflows/build-paper.yml'

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tectonic
        uses: tectonic-typesetting/setup-tectonic@v3
        with:
          biber-version: 'latest'

      - name: Compile the paper
        run: |
          cd paper
          tectonic main.tex
          test -f main.pdf

      - name: Commit the rebuilt PDF
        run: |
          git config user.name  "paper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paper/main.pdf
          if git diff --cached --quiet; then
            echo "no PDF changes"
          else
            git commit -m "Rebuild paper/main.pdf [CI]"
            git push
          fi
