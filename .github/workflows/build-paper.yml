name: build-paper

# Compiles paper/main.tex with tectonic and commits the rendered PDF back
# to main. Runs on every push that touches the source or this workflow, and
# can also be triggered manually from the Actions tab.
#
# Note: tectonic is installed by downloading the pinned static musl binary
# from its GitHub release. tectonic-typesetting/setup-tectonic no longer
# exists, and taiki-e/install-action does not list tectonic as a supported
# tool, so it falls back to cargo-binstall, which fails on runner networks
# (exit 70). A direct release download avoids both failure modes.
on:
  workflow_dispatch:
  push:
    paths:
      - 'paper/main.tex'
      - '.github/workflows/build-paper.yml'

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tectonic (pinned 0.17.0, static musl build)
        run: |
          curl -fsSL -o /tmp/tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/tectonic.tar.gz -C /usr/local/bin tectonic
          tectonic --version

      - name: Compile the paper
        run: |
          cd paper
          tectonic main.tex
          test -f main.pdf

      - name: Commit the rebuilt PDF
        run: |
          git config user.name  "paper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paper/main.pdf
          if git diff --cached --quiet; then
            echo "no PDF changes"
          else
            git commit -m "Rebuild paper/main.pdf [CI]"
            git push
          fi
